<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>const theme = localStorage.getItem("amt-theme") || "dark";document.documentElement.setAttribute("data-theme", theme);</script>
<title>A-M Travel CRM — Add Client</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/crm.css"/>
  <link rel="stylesheet" href="../assets/logos.css"/>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo-container">
      <img src="../assets/images/am-logomark.png" alt="A-M Travel Logo" class="logo-image">
      <div class="sidebar-logo">A-M <span>Travel</span></div>
    </div>
    <div class="sidebar-role" id="sidebarRole">Loading...</div>
            <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
      <a href="clients.html" class="nav-item">👥 Clients</a>
      <a href="add-client.html" class="nav-item">➕ Add Client</a>
      <a href="sales.html" class="nav-item">💰 Sales & Quotes</a>
      <a href="invoice.html" class="nav-item admin-only" style="display:none">🧾 Invoice</a>
      <a href="worker-performance.html" class="nav-item admin-only" style="display:none">📈 Workers</a>
      <a href="backup.html" class="nav-item admin-only" style="display:none">💾 Backup</a>
      <a href="users.html" class="nav-item superadmin-only" style="display:none">⚙️ Manage Users</a>
    </nav>

    <button class="btn-logout" onclick="handleLogout()">🚪 Sign Out</button>
  </aside>

  <main class="main-content">
    <a href="clients.html" class="back-btn">← Back to Clients</a>
    <div class="topbar">
      <div>
        <h1 class="page-title">Add New Client</h1>
        <p class="page-sub">Fill in the client details below</p>
      </div>
    </div>

    <div class="card">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="full_name" placeholder="e.g. Juan dela Cruz"/>
        </div>
        <div class="form-group">
          <label>Passport Number</label>
          <input type="text" id="passport_number" placeholder="e.g. P1234567A"/>
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" id="contact" placeholder="e.g. +63 917 123 4567"/>
        </div>
        <div class="form-group">
          <label>Nationality</label>
          <input type="text" id="nationality" placeholder="e.g. Filipino"/>
        </div>
        <div class="form-group">
          <label>Trip Type</label>
          <select id="trip_type">
            <option value="">Select trip type</option>
            <option>🏖️ Vacation</option>
            <option>💼 Business Trip</option>
            <option>🚨 Emergency Travel</option>
            <option>✈️ OFW / Balikbayan</option>
            <option>🌍 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Registered Date *</label>
          <input type="date" id="registered_date" required/>
        </div>
        <div class="form-group">
          <label>Source of Lead</label>
          <select id="source_of_lead">
            <option value="">Select source</option>
            <option>📘 Facebook</option>
            <option>📷 Instagram</option>
            <option>🔍 Google</option>
            <option>💬 WhatsApp</option>
            <option>🐦 Twitter/X</option>
            <option>🔗 LinkedIn</option>
            <option>👥 Referral</option>
            <option>🌐 Other Social Media</option>
            <option>📞 Direct Call</option>
            <option>🤝 Walk-in</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="New">🆕 New</option>
            <option value="Referred client">🔄 Referred client</option>
            <option value="Return Client">🔁 Return Client</option>
            <option value="Converted">✅ Converted</option>
            <option value="Loss">❌ Loss</option>
          </select>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Notes</label>
          <textarea id="notes" placeholder="Any additional notes about this client..."></textarea>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Upload Document (Passport Copy, Visa, etc.)</label>
          <div class="file-upload" onclick="document.getElementById('docFile').click()">
            <input type="file" id="docFile" accept=".pdf,.jpg,.jpeg,.png" onchange="handleFileSelect(event)"/>
            <div class="file-upload-label">
              <div style="font-size:2rem;margin-bottom:8px;">📎</div>
              <div>Click to upload or drag & drop</div>
              <div style="font-size:0.75rem;margin-top:4px;">PDF, JPG, PNG accepted</div>
              <div id="fileName" style="color:var(--accent);margin-top:8px;font-size:0.85rem;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="saveBtn" onclick="saveClient()">💾 Save Client</button>
        <a href="clients.html" class="btn btn-ghost">Cancel</a>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
  <script>
    let currentUser = null;

    window.addEventListener('load', async () => {
      const user = await requireAuth();
      currentUser = user;
      const profile = await getProfile(user.id);
      const role = profile.role;
      document.getElementById('sidebarRole').textContent = roleLabel(role);
      applyRoleUI(role);
      setActiveNav();

      // Temporary opt-in debug for client save flow. Enable with:
      // localStorage.setItem('amt-debug-client','1')
      window.debugClient = localStorage.getItem('amt-debug-client') === '1';

      // Auto-set today's date for registered_date
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('registered_date').value = today;
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileName').textContent = '✅ ' + file.name;
      }
    }

    async function saveClient() {
      const full_name = document.getElementById('full_name').value.trim();
      if (!full_name) { showToast('Full name is required.', 'error'); return; }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      let document_url = null;
      const fileInput = document.getElementById('docFile');

      // Upload document if selected
      if (fileInput.files[0]) {
        const file = fileInput.files[0];
        const fileName = `${Date.now()}_${file.name}`;
        const { data: uploadData, error: uploadError } = await supabaseClient
          .storage
          .from('client-documents')
          .upload(fileName, file);

        if (uploadError) {
          // Show the upload error message so user can act on it
          const uploadMsg = uploadError.message || 'Document upload failed. Saving without document.';
          showToast('Document upload failed: ' + uploadMsg, 'error');
          console.error('Document upload error:', uploadError);
          if (window.debugClient) console.log('[DEBUG] uploadError', uploadError);
        } else {
          const { data: urlData } = supabaseClient.storage
            .from('client-documents')
            .getPublicUrl(fileName);
          document_url = urlData.publicUrl;
        }
      }

      // Attempt to insert client including registered_date. If the database schema does not
      // include the registered_date column (Supabase schema cache error), retry inserting
      // without that field so users can still save clients while the DB is fixed.
      let insertPayload = [{
        full_name,
        passport_number: document.getElementById('passport_number').value.trim() || null,
        contact: document.getElementById('contact').value.trim() || null,
        nationality: document.getElementById('nationality').value.trim() || null,
        trip_type: document.getElementById('trip_type').value || null,
        registered_date: document.getElementById('registered_date').value || null,
        source_of_lead: document.getElementById('source_of_lead').value || null,
        status: document.getElementById('status').value || 'New',
        notes: document.getElementById('notes').value.trim() || null,
        document_url,
        created_by: currentUser.id,
        updated_by: currentUser.id
      }]);

      // Try inserting the payload. If the DB schema is missing registered_date,
      // PostgREST/Supabase may return an error mentioning the column — handle that
      // by retrying without the field so users can continue working.
      let insertResult = await supabaseClient.from('clients').insert(insertPayload);
      let insertError = insertResult.error;
      if (insertError) {
        // Show the original insert error so the user sees what failed immediately
        console.error('Client insert error:', insertError);
        showToast('Error saving client: ' + (insertError.message || 'Unknown error'), 'error');
        if (window.debugClient) console.log('[DEBUG] insertError', insertError);

        // Detect specific schema cache error mentioning registered_date (case-insensitive)
        const msg = String(insertError.message || '').toLowerCase();
        if (msg.includes("registered_date")) {
          // Retry without registered_date field
          const payloadNoDate = insertPayload.map(p => { const copy = { ...p }; delete copy.registered_date; return copy; });
          const retryResult = await supabaseClient.from('clients').insert(payloadNoDate);
          if (retryResult.error) {
            showToast('Error saving client: ' + retryResult.error.message, 'error');
            btn.disabled = false;
            btn.textContent = '💾 Save Client';
            return;
          }

          // Log that we saved without the registered_date due to schema mismatch
          await logActivity('CREATE_CLIENT', `Created client (without registered_date due to DB schema): ${full_name}`);
          showToast('Client saved, but registered_date column is missing on the database. Please ask admin to add it.', 'warning');
          setTimeout(() => window.location.href = 'clients.html', 1500);
          return;
        }

        btn.disabled = false;
        btn.textContent = '💾 Save Client';
        return;
      }

      await logActivity('CREATE_CLIENT', `Created client: ${full_name}`);
      showToast('Client saved successfully! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'clients.html', 1500);
    }

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast toast-${type} show`;
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    function roleLabel(r) {
      return { superadmin: '👑 Super Admin', admin: '🔧 Admin', worker: '👷 Worker', tester: '🧪 Tester' }[r] || r;
    }

    // Ensure the saveClient function is available on the global window object so
    // inline onclick handlers (e.g., <button onclick="saveClient()">) can call it
    // even in environments where scoping behaves differently.
    if (typeof window !== 'undefined' && typeof saveClient === 'function') {
      window.saveClient = saveClient;
    }
  </script>
</body>
</html>
