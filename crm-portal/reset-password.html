<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script>const theme = localStorage.getItem("amt-theme") || "dark";document.documentElement.setAttribute("data-theme", theme);</script>
  <title>A-M Travel CRM — Reset Password</title>
  <link rel="stylesheet" href="css/crm.css"/>
  <link rel="stylesheet" href="../assets/logos.css"/>
  <style>
    body { align-items: center; justify-content: center; }
    .reset-card { width: min(420px, calc(100% - 32px)); }
    .reset-card h1 { margin-bottom: 8px; }
    .reset-card > p { color: var(--muted); margin-bottom: 24px; }
    .reset-card .btn { width: 100%; justify-content: center; margin-top: 16px; }
    .reset-card .back-link { display: block; margin-top: 18px; text-align: center; color: var(--accent); text-decoration: none; }
    .reset-message { display: none; margin-top: 16px; padding: 11px 14px; border-radius: 10px; }
    .reset-message.show { display: block; }
    .reset-message.error { color: var(--error); background: rgba(239,68,68,.12); }
    .reset-message.success { color: var(--success); background: rgba(34,197,94,.12); }
  </style>
</head>
<body>
  <main class="card reset-card">
    <h1>Reset your password</h1>
    <p>Enter your email and we’ll send you a secure link to choose a new password.</p>
    <div id="requestForm">
      <label for="resetEmail">Email address</label>
      <input id="resetEmail" type="email" autocomplete="email" required>
      <button class="btn btn-primary" onclick="requestReset()">Send reset link</button>
    </div>
    <div id="newPasswordForm" style="display:none;">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password">
      <label for="confirmPassword" style="margin-top:16px;">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password">
      <button class="btn btn-primary" onclick="finishReset()">Save new password</button>
    </div>
    <div class="reset-message" id="resetMessage" role="status"></div>
    <a class="back-link" href="login.html">Back to sign in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        document.getElementById('requestForm').style.display = 'none';
        document.getElementById('newPasswordForm').style.display = 'block';
        showMessage('Choose a new password below.', 'success');
      }
    });

    function showMessage(message, type) {
      const element = document.getElementById('resetMessage');
      element.textContent = message;
      element.className = `reset-message show ${type}`;
    }

    async function requestReset() {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) {
        showMessage('Please enter your email address.', 'error');
        return;
      }
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/crm-portal/reset-password.html`
      });
      if (error) {
        showMessage(error.message || 'Unable to send a reset link.', 'error');
        return;
      }
      showMessage('Check your email for a secure password reset link.', 'success');
    }

    async function finishReset() {
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;
      if (password.length < 6) {
        showMessage('Your password must be at least 6 characters.', 'error');
        return;
      }
      if (password !== confirmation) {
        showMessage('The passwords do not match.', 'error');
        return;
      }
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        showMessage(error.message || 'Unable to change your password.', 'error');
        return;
      }
      showMessage('Your password was changed. You can now sign in.', 'success');
      document.getElementById('newPasswordForm').style.display = 'none';
    }
  </script>
</body>
</html>
